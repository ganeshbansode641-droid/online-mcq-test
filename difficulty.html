<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Difficulty - Online MCQ Test</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Select Difficulty</h1>

            <p id="selectedSubject">
                Loading subject...
            </p>

            <div class="difficulty-buttons">

                <button class="difficulty-btn easy" data-level="Simple">
                    🟢 Simple
                </button>

                <button class="difficulty-btn medium" data-level="Medium">
                    🟡 Medium
                </button>

                <button class="difficulty-btn hard" data-level="Hard">
                    🔴 Hard
                </button>

            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Online MCQ Test</p>
