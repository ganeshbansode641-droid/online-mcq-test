<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Test Result - Online MCQ Test</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="result-card">

            <h1>🎉 Test Completed!</h1>

            <p class="result-subtitle">
                Here is your test result
            </p>


            <!-- Score Summary -->

            <div class="score-summary">

                <div class="score-box">
                    <span id="score">0</span>
                    <p>Correct Answers</p>
                </div>


                <div class="score-box">
                    <span id="wrong">0</span>
                    <p>Wrong Answers</p>
                </div>


                <div class="score-box">
                    <span id="percentage">0%</span>
                    <p>Percentage</p>
                </div>

            </div>


            <!-- Question Review -->

            <h2 class="review-title">
                Answer Review
            </h2>


            <div id="reviewContainer">

            </div>


            <!-- Buttons -->

            <button id="newTestBtn" class="btn">
                Take Another Test
            </button>

            <br><br>

            <button id="logoutBtn"
                class="btn logout-btn">

                Logout

            </button>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Online MCQ Test
        </p>

        <p>
            Developed by
            <strong>Ganesh Bansode</strong> ❤️
        </p>

    </footer>


    <script type="module"
        src="js/result.js">
    </script>

</body>

</html>
